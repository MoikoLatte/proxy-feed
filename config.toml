# Off-box monosans config — proxy-feed repo
debug = false

[output]
path = "./proxies"
format = "txt"
sort_by_speed = true

[output.txt]
enabled = true

[output.json]
enabled = false

[checking]
url = "http://api.ipify.org"
timeout = 8
concurrency = 200

[scraping.http]
enabled = true
urls = [
  "https://api.proxyscrape.com/v3/free-proxy-list/get?request=getproxies&protocol=http",
  "https://api.proxyscrape.com/v3/free-proxy-list/get?request=getproxies&protocol=https",
  "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/refs/heads/master/http.txt",
  "https://raw.githubusercontent.com/proxifly/free-proxy-list/refs/heads/main/proxies/protocols/http/data.txt",
